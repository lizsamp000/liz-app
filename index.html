.gtbl{border-collapse:collapse;width:100%}

.ghost{width:100%;background:var(--wh);color:var(--w);font-size:13px;font-weight:600;border:1.5px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;margin-top:8px}
.spacer{height:2rem}

{id:103,m:'café',n:'bowl de iogurte',t:3,

     {l:'molho',o:['mostarda com mel','mel 2cs + azeite 1cs + ½ limão + mostarda 1cs','iogurte grego com mostarda','iogurte natural ⅓ xícara + mostarda 1cs + mel 1 colher de sobremesa + água 2cs','cottage com mostarda','½ limão + mostarda 1cs + ketchup 1cs + azeite 8g (pesar) + adoçante 4-5 gotas + pitada de sal','ranch mr taste','caesar hellmann\'s 12g (1 colher de sopa)']}],

    const FRUTA_102=['mamão formosa 150g','uva 120g','manga 85g','melancia 220g','melão 275g','banana 65g','abacate 40g'];

    Object.keys(old).forEach(rid=>{

      const out={};

// ═══════════════ helpers ═══════════════
function today(){return new Date().toDateString()}
function wkStart(){const d=new Date(),s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7));return s.toDateString()}
function weekDates(){const n=new Date(),off=-((n.getDay()+6)%7);return Array.from({length:7},(_,i)=>{const d=new Date(n);d.setDate(n.getDate()+off+i);return d})}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function curMealIdx(){const m=nowMin();for(let i=0;i<MEALS.length;i++)if(m<MEALS[i].to)return i;return 3}
function byMeal(k){return RB.filter(r=>r.m===k)}
function rec(id){return RB.find(r=>r.id===id)}
// nomes antigos → nomes atuais, pra que corrigir uma gramatura não perca a escolha já salva
const ALIAS={
 'artesano integral 2 fatias':'artesano integral 2 fatias (66,6g)',
 'croutons 1,5 fatia':'croutons 1,5 fatia (37,5g)',
 'pão de hambúrguer 1un (50g)':'pão de hambúrguer pullman 1un (50g)',
 'pão de hambúrguer plusvita 1un':'pão de hambúrguer plusvita 1un (50g)',
 'risoni cozido 110g':'macarrão ou risoni cozido 110g',
 'minas frescal 20g':'minas frescal light 20g',
 'cottage 30g':'cottage lacfree 30g',
 'frango desfiado 40g':'frango desfiado 50g',
 'atum ralado 55g':'atum ralado 65g'
};
function pickOf(rid,si){
  const r=rec(rid);if(!r||!r.sl[si])return 0;
  const v=st.pick[rid]&&st.pick[rid][si];
  if(v===undefined)return 0;
  let i=r.sl[si].o.indexOf(v);
  if(i<0&&ALIAS[v])i=r.sl[si].o.indexOf(ALIAS[v]);
  return i>=0?i:0;
}
function lineOf(r){return r.sl.map((s,i)=>s.o[pickOf(r.id,i)]||s.o[0]).join(' · ')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function logged(mk,ds){return(st.log[ds||today()]||{})[mk]}
function hashDay(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function suggest(mi){
  const list=byMeal(MEALS[mi].k);
  const base=hashDay(today()+MEALS[mi].k);
  const off=st.swap[today()+'_'+mi]||0;
  const pool=st.fast?list.filter(r=>r.t<=6):list;
  const use=pool.length?pool:list;
  return use[(base+off)%use.length];
}
function waterMl(ds){const a=st.water[ds||today()];return Array.isArray(a)?a.reduce((x,y)=>x+y,0):0}
function metaAgua(){return Math.round((st.peso||50)*ML_POR_KG)}
function atalhoDone(n){return!!((st.atalhos[wkStart()]||{})[n])}
function buyCount(){return Object.keys(st.buy).filter(k=>st.buy[k]).length}

// ═══════════════ render ═══════════════
function render(){
  const mi=curMealIdx(),M=MEALS[mi],td=today(),d=new Date();
  let h='';
  h+=`<div class="hd"><div><h1>liz</h1><div class="hn">${DF[d.getDay()]}</div></div>`;
  h+=`<div><div class="hc">${M.full}</div><div class="hl">${M.t}</div></div></div>`;
  h+=`<div class="mt">`;
  ['hoje','comer','compras','semana'].forEach(k=>{h+=`<div class="${st.tab===k?'a':''}" onclick="setTab('${k}')">${k}</div>`});
  h+=`</div>`;
  if(st.tab==='hoje')h+=viewHoje(mi,td);
  if(st.tab==='comer')h+=viewComer(mi);
  if(st.tab==='compras')h+=viewCompras();
  if(st.tab==='semana')h+=viewSemana(td);
  h+=`<div class="spacer"></div>`;
  document.getElementById('app').innerHTML=h;
}

// ─────────── hoje ───────────
function viewHoje(mi,td){
  const M=MEALS[mi],lg=logged(M.k),r=lg?rec(lg):suggest(mi);
  let h='';
  h+=`<div class="now"><div class="nowh">agora · ${M.full}<span>${M.t}</span></div><div class="nowb">`;
  if(r){
    h+=`<div class="nwn">${r.n}</div><div class="nwt">${r.t} min de preparo</div>`;
    h+=`<div class="nwi">${lineOf(r)}</div>`;
    h+=`<div class="nwa"><button class="${lg?'done':'pri'}" onclick="logMeal('${M.k}',${r.id})">${lg?'✓ comi isso':'comi isso'}</button>`;
    if(!lg)h+=`<button onclick="swapSug(${mi})">outra opção</button>`;
    h+=`</div>`;
  }
  h+=`</div><div class="lnk" onclick="goComer('${M.k}')">ver as ${byMeal(M.k).length} opções de ${M.full} →</div></div>`;
  if(mi<3){const N=MEALS[mi+1];h+=`<div class="nxt">depois: ${N.full} às ${N.t}</div>`}

  const meta=metaAgua(),ml=waterMl(td),pct=Math.min(ml/meta*100,100);
  h+=`<div class="sec"><div class="slbl">água <b>${ml}ml de ${meta}ml</b> <button class="eb ${st.editMeta?'on':''}" onclick="st.editMeta=!st.editMeta;render()">${st.editMeta?'pronto':'meta'}</button></div><div class="card">`;
  if(st.editMeta){
    h+=`<div style="font-size:11px;color:var(--mu);line-height:1.55;margin-bottom:8px">a Sara pede 40–45ml por kg de peso e o app usa ${ML_POR_KG}ml/kg. só mexa aqui se o seu peso mudar.</div>`;
    h+=`<div class="arow" style="margin:0 0 12px"><input id="peso" class="inp" type="number" inputmode="decimal" value="${st.peso}" style="font-size:13px"><span style="font-size:12px;color:var(--mu);flex-shrink:0">kg</span><button class="abtn" onclick="setPeso()">✓</button></div>`;
  }
  h+=`<div class="wbar"><div style="width:${pct}%"></div></div>`;
  h+=`<div style="font-size:11px;color:${ml>=meta?'var(--gn)':'var(--mu)'};font-weight:${ml>=meta?600:400}">${ml>=meta?'meta batida hoje 🎉':'faltam '+(meta-ml)+'ml'}</div>`;
  h+=`<div class="wbtn"><button onclick="addWater(250)">+ copo 250ml</button><button class="pri" onclick="addWater(750)">+ garrafa 750ml</button>`;
  h+=`<button onclick="undoWater()" style="flex:0 0 46px">−</button></div></div></div>`;

  const done=st.habits.filter(x=>(st.hb[td]||{})[x]).length;
  h+=`<div class="sec"><div class="slbl">hábitos de hoje <b>${done}/${st.habits.length}</b> <button class="eb ${st.editH?'on':''}" onclick="st.editH=!st.editH;render()">${st.editH?'pronto':'editar'}</button></div><div class="card" style="padding:2px 14px">`;
  st.habits.forEach((hb,i)=>{
    if(st.editH){
      h+=`<div class="hrow" style="cursor:default"><div class="hnm">${hb}</div>`;
      h+=`<button class="hmv" onclick="moveHabit(${i},-1)" ${i===0?'disabled':''}>↑</button>`;
      h+=`<button class="hmv" onclick="moveHabit(${i},1)" ${i===st.habits.length-1?'disabled':''}>↓</button>`;
      h+=`<button class="xb" onclick="rmHabit(${i})">✕</button></div>`;
    }else{
      const on=!!(st.hb[td]||{})[hb],info=HABIT_INFO[hb];
      h+=`<div class="hrow" onclick="toggleHabit(${i},'${td}')"><div class="hbx ${on?'on':''}">✓</div><div style="flex:1"><div class="hnm ${on?'on':''}">${hb}</div>${info?`<div class="hsub">${info}</div>`:''}</div></div>`;
    }});
  if(st.editH){
    h+=`<div class="arow" style="padding:4px 0 12px"><input id="hb-new2" class="inp" style="font-size:12px" placeholder="novo hábito"><button class="abtn" onclick="addHabit('hb-new2')">+</button></div>`;
    h+=`<div style="font-size:10.5px;color:var(--mu);line-height:1.5;padding-bottom:12px">tirar um hábito não apaga o histórico dele — se você adicionar de volta com o mesmo nome, os dias marcados voltam.</div>`;
  }
  h+=`</div></div>`;

  const ro=st.accOpen['rotina'];
  h+=`<div class="sec"><div class="acc"><div class="acch" onclick="toggleAcc('rotina')"><div><div class="acct">rotina da manhã</div><div class="accs">as quantidades e os modos de preparo do plano</div></div><span style="color:var(--mu);font-size:12px">${ro?'▴':'▾'}</span></div>`;
  if(ro){h+=`<div class="accb prose">`;ROTINA.forEach(x=>{h+=`<div style="font-size:12px;line-height:1.65;margin-bottom:9px">• ${x}</div>`});h+=`</div>`}
  h+=`</div>`;

  const fo=st.accOpen['fora'];
  h+=`<div class="acc"><div class="acch" onclick="toggleAcc('fora')"><div><div class="acct">tô na rua / sem nada pronto</div><div class="accs">o que fazer quando não dá pra seguir a receita</div></div><span style="color:var(--mu);font-size:12px">${fo?'▴':'▾'}</span></div>`;
  if(fo){h+=`<div class="accb prose">`;FORA.forEach(x=>{h+=`<div style="font-size:12px;line-height:1.65;margin-bottom:8px">• ${x}</div>`});h+=`</div>`}
  h+=`</div></div>`;
  return h;
}

// ─────────── comer ───────────
function viewComer(mi){
  const filt=st.mealFilt||MEALS[mi].k;
  let list=byMeal(filt);
  if(st.fast)list=list.filter(r=>r.t<=6);
  const lg=logged(filt);
  let h='';
  h+=`<div class="fseg">`;
  MEALS.forEach(m=>{h+=`<span class="${filt===m.k?'a':''}" onclick="setMeal('${m.k}')">${m.k}</span>`});
  h+=`<span class="${st.fast?'a':''}" onclick="toggleFast()">⚡ até 6 min</span></div>`;
  h+=`<div class="sec">`;
  if(!list.length)h+=`<div class="card" style="text-align:center;color:var(--mu);font-size:13px">nenhuma receita até 6 min nessa refeição — toque no filtro pra desligar</div>`;
  list.forEach(r=>{
    const op=!!st.open[r.id],isLg=lg===r.id;
    h+=`<div class="rc ${op?'on':''}"><div class="rch" onclick="toggleOpen(${r.id})"><div style="flex:1;min-width:0">`;
    h+=`<div class="rn">${r.n}</div><div class="rt">${r.t} min · ${r.sl.length} componentes${r.chk?' · ⚠ conferir':''}</div>`;
    h+=`<div class="ri">${lineOf(r)}</div></div>`;
    h+=`<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">`;
    h+=`<span class="pill ${isLg?'d':r.t<=6?'f':''}">${isLg?'comi':r.t<=6?'rápido':r.t+'min'}</span>`;
    h+=`<span style="font-size:11px;color:var(--mu)">${op?'▴':'▾'}</span></div></div>`;
    if(op){
      h+=`<div class="rbody"><div style="font-size:10px;color:var(--mu);margin-bottom:10px">toque pra trocar por uma substituição do plano — a gramatura já vem ajustada</div>`;
      r.sl.forEach((s,si)=>{
        h+=`<div class="slot"><div class="sll">${s.l}</div><div class="chips">`;
        s.o.forEach((o,oi)=>{h+=`<span class="chip ${pickOf(r.id,si)===oi?'on':''}" onclick="setPick(${r.id},${si},${oi})">${o}</span>`});
        h+=`</div></div>`;
      });
      if(r.mp)h+=`<div class="mp prose"><div class="mph">preparo</div>${r.mp}</div>`;
      if(r.chk)h+=`<div class="chk prose"><div class="chkh">conferir com a sara</div>${r.chk}</div>`;
      h+=`<textarea class="nta" id="nt-${r.id}" onblur="saveNote(${r.id})" placeholder="suas anotações, links do tiktok...">${esc(st.notes[r.id]||'')}</textarea>`;
      h+=`<button class="big" onclick="logMeal('${r.m}',${r.id})" ${isLg?'style="background:var(--gn)"':''}>${isLg?'✓ registrado hoje':'comi isso'}</button></div>`;
    }
    h+=`</div>`;
  });
  h+=`</div>`;

  const feitos=ATALHOS.filter(a=>atalhoDone(a.n)).length,ao=st.accOpen['atalhos'];
  h+=`<div class="sec"><div class="acc"><div class="acch" onclick="toggleAcc('atalhos')"><div><div class="acct">atalhos do domingo</div><div class="accs">${feitos} de ${ATALHOS.length} feitos · opcional, só acelera</div></div><span style="color:var(--mu);font-size:12px">${ao?'▴':'▾'}</span></div>`;
  if(ao){
    h+=`<div class="accb"><div style="font-size:11px;color:var(--mu);line-height:1.55;margin-bottom:10px">nada aqui é pré-requisito. cada item só deixa algumas receitas mais rápidas durante a semana.</div>`;
    ATALHOS.forEach((a,i)=>{const on=atalhoDone(a.n);
      h+=`<div class="prow" onclick="toggleAtalho(${i})"><div class="hbx ${on?'on':''}" style="margin-top:1px">✓</div><div style="flex:1"><div class="pnm ${on?'on':''}">${a.n}</div>`;
      const sub=[a.d,a.r.length?`acelera ${a.r.length} receita${a.r.length>1?'s':''}`:''].filter(Boolean).join(' · ');
      if(sub)h+=`<div class="pds">${sub}</div>`;
      h+=`</div></div>`});
    h+=`<button class="ghost" onclick="clearAtalhos()">limpar a semana</button></div>`;
  }
  h+=`</div></div>`;
  return h;
}

// ─────────── compras ───────────
function viewCompras(){
  const n=buyCount();
  let h='';
  h+=`<div class="sec"><div class="slbl">lista de compras <b>${n} ${n===1?'item':'itens'}</b> <button class="eb ${st.editL?'on':''}" onclick="st.editL=!st.editL;render()">${st.editL?'pronto':'editar'}</button></div>`;
  h+=`<div style="font-size:11.5px;color:var(--mu);line-height:1.55;margin-bottom:12px">marque só o que acabou. no mercado, vá desmarcando.</div>`;
  if(n){
    h+=`<div style="display:flex;gap:8px"><button class="ghost" style="margin:0" onclick="toggleSoFalta()">${st.soFalta?'ver a lista toda':'só o que falta ('+n+')'}</button>`;
    h+=`<button class="ghost" style="margin:0" onclick="clearBuy()">já comprei</button></div>`;
  }
  h+=`</div>`;
  Object.keys(st.lista).forEach(cat=>{
    let items=st.lista[cat];if(!items)return;
    const sid=cat.replace(/\W/g,''),mk=items.filter(i=>st.buy[i]).length;
    if(st.soFalta&&!st.editL){items=items.filter(i=>st.buy[i]);if(!items.length)return;}
    h+=`<div style="padding:1rem 1.25rem 0"><div style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--mu);margin-bottom:7px">${cat}${mk?` · ${mk}`:''}</div>`;
    h+=`<div class="chips">`;
    items.forEach((it,ii)=>{
      if(st.editL)h+=`<span class="chip on">${it}<span style="margin-left:7px;cursor:pointer" onclick="rmItem('${esc(cat)}',${ii})">✕</span></span>`;
      else h+=`<span class="chip ${st.buy[it]?'on':''}" onclick="toggleBuy('${esc(it)}')">${it}</span>`;
    });
    h+=`</div>`;
    if(st.editL)h+=`<div class="arow"><input id="li-${sid}" class="inp" style="font-size:12px" placeholder="novo item em ${cat}"><button class="abtn" onclick="addItem('${esc(cat)}','${sid}')">+</button></div>`;
    h+=`</div>`;
  });
  if(st.editL)h+=`<div class="sec"><div class="slbl">nova categoria</div><div class="arow"><input id="li-newcat" class="inp" style="font-size:12px" placeholder="nome da categoria"><button class="abtn" onclick="addCat()">+</button></div></div>`;

  const bo=st.accOpen['bk'];
  h+=`<div class="sec"><div class="acc"><div class="acch" onclick="toggleAcc('bk')"><div><div class="acct">backup dos dados</div><div class="accs">salvar ou passar pra outro aparelho</div></div><span style="color:var(--mu);font-size:12px">${bo?'▴':'▾'}</span></div>`;
  if(bo){
    h+=`<div class="accb"><div style="font-size:11px;color:var(--mu);line-height:1.55;margin-bottom:9px">salva tudo do app (lista, escolhas das receitas, hábitos, água, refeições registradas). os dados ficam só neste navegador.</div>`;
    h+=`<button class="big" style="margin-top:0" onclick="genBackup()">gerar backup (copia automático)</button>`;
    h+=`<textarea id="bk-out" class="nta" readonly placeholder="o backup vai aparecer aqui"></textarea>`;
    h+=`<textarea id="bk-in" class="nta" placeholder="cole um backup aqui pra restaurar"></textarea>`;
    h+=`<button class="ghost" onclick="restoreBackup()">restaurar backup</button></div>`;
  }
  h+=`</div></div>`;
  return h;
}

// ─────────── semana ───────────
function viewSemana(td){
  const wd=weekDates(),now=new Date();
  let h='',tot=0;
  const past=wd.filter(d=>d<=now||d.toDateString()===td);
  past.forEach(d=>{const k=d.toDateString();MEALS.forEach(m=>{if((st.log[k]||{})[m.k])tot++})});
  h+=`<div class="sec"><div class="slbl">refeições registradas <b>${tot} de ${past.length*4}</b></div><div class="card">`;
  h+=`<table class="gtbl"><thead><tr><td style="width:22%"></td>`;
  wd.forEach((d,i)=>{h+=`<td class="gday ${d.toDateString()===td?'td':''}">${DS[i]}<br><span style="font-size:9px">${d.getDate()}</span></td>`});
  h+=`</tr></thead><tbody>`;
  MEALS.forEach(m=>{
    h+=`<tr><td class="glbl">${m.k}</td>`;
    wd.forEach(d=>{const k=d.toDateString(),on=!!(st.log[k]||{})[m.k],fu=d>now&&k!==td;
      h+=`<td><div class="gcel ${on?'on':''} ${k===td&&!on?'td':''} ${fu?'fu':''}">${on?'✓':''}</div></td>`});
    h+=`</tr>`});
  h+=`</tbody></table></div></div>`;

  let streak=0;
  for(let i=1;i<=365;i++){const d=new Date(now);d.setDate(now.getDate()-i);const dh=st.hb[d.toDateString()]||{};if(st.habits.length&&st.habits.every(x=>dh[x]))streak++;else break}
  h+=`<div class="sec"><div class="slbl">hábitos${streak?` <b>${streak} dia${streak>1?'s':''} completos seguidos</b>`:''} <button class="eb ${st.editH?'on':''}" onclick="st.editH=!st.editH;render()">${st.editH?'pronto':'editar'}</button></div><div class="card">`;
  h+=`<div style="overflow-x:auto"><table class="gtbl" style="min-width:320px"><thead><tr><td style="width:34%"></td>`;
  wd.forEach((d,i)=>{h+=`<td class="gday ${d.toDateString()===td?'td':''}">${DS[i]}</td>`});
  h+=`</tr></thead><tbody>`;
  st.habits.forEach((hb,hi)=>{
    h+=`<tr><td class="glbl">${hb}${st.editH?` <button class="xb" onclick="rmHabit(${hi})">✕</button>`:''}</td>`;
    wd.forEach(d=>{const k=d.toDateString(),on=!!(st.hb[k]||{})[hb],fu=d>now&&k!==td;
      h+=`<td><div class="gcel ${on?'on':''} ${k===td&&!on?'td':''} ${fu?'fu':''}" ${fu?'':`onclick="toggleHabit(${hi},'${k}')"`}>${on?'✓':''}</div></td>`});
    h+=`</tr>`});
  h+=`</tbody></table></div>`;
  if(st.editH)h+=`<div class="arow"><input id="hb-new" class="inp" style="font-size:12px" placeholder="novo hábito"><button class="abtn" onclick="addHabit()">+</button></div>`;
  h+=`</div></div>`;

  h+=`<div class="sec"><div class="slbl">água na semana</div><div class="card"><div class="mini">`;
  wd.forEach(d=>{const p=Math.min(waterMl(d.toDateString())/metaAgua()*100,100);h+=`<div><i style="height:${p}%"></i></div>`});
  h+=`</div><div class="minix">`;
  wd.forEach((d,i)=>{h+=`<span>${DS[i]}</span>`});
  h+=`</div></div></div>`;
  return h;
}

// ═══════════════ ações ═══════════════
function setTab(t){st.tab=t;if(t!=='comer')st.mealFilt=null;st.editH=false;st.editL=false;st.editMeta=false;window.scrollTo(0,0);render()}
function setMeal(k){st.mealFilt=k;render()}
function goComer(k){st.tab='comer';st.mealFilt=k;window.scrollTo(0,0);render()}
function toggleFast(){st.fast=!st.fast;render()}
function toggleOpen(id){st.open[id]=!st.open[id];render()}
function toggleAcc(k){st.accOpen[k]=!st.accOpen[k];render()}
function setPick(rid,si,oi){const r=rec(rid);if(!r||!r.sl[si])return;if(!st.pick[rid])st.pick[rid]={};st.pick[rid][si]=r.sl[si].o[oi];sv('liz_pick',st.pick);render()}
function saveNote(id){const el=document.getElementById('nt-'+id);if(el){st.notes[id]=el.value;sv('liz_notes',st.notes)}}
function logMeal(mk,id){const t=today();if(!st.log[t])st.log[t]={};if(st.log[t][mk]===id)delete st.log[t][mk];else st.log[t][mk]=id;sv('liz_log',st.log);render()}
function swapSug(mi){const k=today()+'_'+mi;st.swap[k]=(st.swap[k]||0)+1;sv('liz_swap',st.swap);render()}
function addWater(ml){const t=today();if(!Array.isArray(st.water[t]))st.water[t]=[];st.water[t].push(ml);sv('liz_water',st.water);render()}
function undoWater(){const t=today();if(Array.isArray(st.water[t])&&st.water[t].length){st.water[t].pop();sv('liz_water',st.water);render()}}
function setPeso(){const el=document.getElementById('peso'),v=el?parseFloat(String(el.value).replace(',','.')):NaN;if(!isFinite(v)||v<25||v>250)return;st.peso=v;sv('liz_peso',v);st.editMeta=false;render()}
function toggleHabit(hi,ds){const hb=st.habits[hi];if(!hb)return;if(!st.hb[ds])st.hb[ds]={};st.hb[ds][hb]=!st.hb[ds][hb];sv('liz_hb',st.hb);render()}
function addHabit(id){const el=document.getElementById(id||'hb-new'),v=el?el.value.trim().toLowerCase():'';if(!v||st.habits.includes(v))return;st.habits.push(v);sv('liz_habits',st.habits);render()}
function rmHabit(i){st.habits.splice(i,1);sv('liz_habits',st.habits);render()}
function moveHabit(i,d){const j=i+d;if(j<0||j>=st.habits.length)return;[st.habits[i],st.habits[j]]=[st.habits[j],st.habits[i]];sv('liz_habits',st.habits);render()}
function toggleAtalho(i){const w=wkStart(),n=ATALHOS[i].n;if(!st.atalhos[w])st.atalhos[w]={};st.atalhos[w][n]=!st.atalhos[w][n];sv('liz_atalhos',st.atalhos);render()}
function clearAtalhos(){st.atalhos[wkStart()]={};sv('liz_atalhos',st.atalhos);render()}
function toggleBuy(it){st.buy[it]=!st.buy[it];sv('liz_buy',st.buy);render()}
function toggleSoFalta(){st.soFalta=!st.soFalta;render()}
function clearBuy(){st.soFalta=false;st.buy={};sv('liz_buy',st.buy);render()}
function addItem(cat,sid){const el=document.getElementById('li-'+sid),v=el?el.value.trim().toLowerCase():'';if(!v)return;if(!st.lista[cat])st.lista[cat]=[];if(!st.lista[cat].includes(v))st.lista[cat].push(v);sv('liz_lista',st.lista);render()}
function rmItem(cat,ii){if(!st.lista[cat])return;const it=st.lista[cat][ii];st.lista[cat].splice(ii,1);delete st.buy[it];sv('liz_lista',st.lista);sv('liz_buy',st.buy);render()}
function addCat(){const el=document.getElementById('li-newcat'),v=el?el.value.trim().toLowerCase():'';if(!v||st.lista[v])return;st.lista[v]=[];sv('liz_lista',st.lista);render()}
function genBackup(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('liz_')===0)o[k]=localStorage.getItem(k)}const t=JSON.stringify(o);const el=document.getElementById('bk-out');if(el)el.value=t;try{if(navigator.clipboard)navigator.clipboard.writeText(t)}catch(e){}}
function restoreBackup(){const el=document.getElementById('bk-in');if(!el||!el.value.trim())return;let o;try{o=JSON.parse(el.value)}catch(e){alert('backup inválido — confira o texto colado');return}if(!confirm('isso vai substituir os dados atuais do app por esse backup. continuar?'))return;Object.keys(o).forEach(k=>{if(k.indexOf('liz_')===0)localStorage.setItem(k,o[k])});location.reload()}

render();
</script>
