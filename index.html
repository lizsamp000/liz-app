const SEED_ACTS=(()=>{const out=[];let id=1000;Object.keys(RAW).forEach(day=>{(RAW[day]||[]).forEach(a=>{out.push({id:id++,n:a.n,sub:a.sub||'',b:a.b||'',m:a.m||'',s:a.s,e:a.e||'',days:[+day]});});});return out;})();

function ld(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch{return def}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function initCO(){const s=ld('liz_cat',null);const fi=ld('liz_fi',null)||FRIDGE_DEF;const fk=Object.keys(fi);if(!s)return fk;const ss=new Set(s);return[...s,...fk.filter(k=>!ss.has(k))];}
function initRO(){const s=ld('liz_ro',null);const ov=ld('liz_ov',{})||{};if(!s)return RB.map(r=>r.id);const ss=new Set(s);return[...s,...RB.map(r=>r.id).filter(id=>!ss.has(id)&&!(ov[id]&&ov[id].deleted))];}
function initActs(){const s=ld('liz_acts',null);if(s)return s;const seed=SEED_ACTS.map(a=>({...a,days:[...a.days]}));const ca=ld('liz_ca',[]);(ca||[]).forEach(a=>seed.push({id:a.id||Date.now()+Math.random(),n:a.n||'',sub:a.sub||'',b:a.b||'',m:a.m||'',s:a.s,e:a.e||'',days:[...(a.days||[])]}));return seed;}
function seedFromActs(def,key){const s=ld('liz_'+key,null);if(s)return s;const set=[...def];[...SEED_ACTS,...(ld('liz_ca',[])||[])].forEach(a=>{const v=a[key==='locais'?'n':key==='bairros'?'b':'m'];if(v&&!set.includes(v))set.push(v);});return set;}
function initLocais(){return seedFromActs(LOCAIS_DEF,'locais');}
function initBairros(){return seedFromActs(BAIRRO_DEF,'bairros');}
function initMods(){return seedFromActs(MOD_DEF,'mods');}

function today(){return new Date().toDateString();}
function getWkStart(){const d=new Date(),s=new Date(d);s.setDate(d.getDate()-d.getDay()+1);return s.toDateString();}

function wk(){return wkKey();}
function getAllPlaces(){return[...PLACES_DEFAULT,...st.customPlaces];}
function getAllMods(){const ex=[...new Set(st.acts.map(a=>a.m))].filter(m=>m&&!st.mods.includes(m));return[...st.mods,...ex];}
function getAllBairros(){const ex=[...new Set(st.acts.map(a=>a.b))].filter(b=>b&&!st.bairros.includes(b));return[...st.bairros,...ex];}
function getAllLocais(){const ex=(st.na&&st.na.n&&!st.locais.includes(st.na.n)&&!st.editLocais)?[st.na.n]:[];return[...ex,...st.locais];}
function getSlots(day){return st.acts.filter(a=>a.days.includes(day)).slice().sort((a,b)=>a.s-b.s);}
function applyF(slots){return slots.filter(s=>{if(st.fMod.length&&!st.fMod.includes(s.m))return false;if(st.fTurno.length&&!st.fTurno.includes(turno(s.s)))return false;if(st.fBairro.length&&!st.fBairro.includes(s.b))return false;return true;});}
function getRecipe(id){const b=RB.find(r=>r.id===id);const o=st.ov[id]||{};if(o.deleted)return null;if(!b&&!o.n)return null;return{...(b||{id,n:'',cat:'',req:[]}),...o};}
function allRecipes(){return st.recOrd.map(id=>getRecipe(id)).filter(Boolean);}
function fridgeHas(i){return!!st.fridge[i];}
function recAvail(r){
  const pd=st.prep[getWkStart()]||{};
  return r.req.every(i=>{
    if(st.prepItems.includes(i))return!!pd[i];
    if(!fridgeHas(i))return false;
    if(st.prepLink[i]&&st.prepItems.includes(st.prepLink[i]))return!!pd[st.prepLink[i]];
    return true;
  });
}
function missing(r){
  const pd=st.prep[getWkStart()]||{};
  return r.req.filter(i=>{
    if(st.prepItems.includes(i))return!pd[i];
    if(!fridgeHas(i))return true;
    if(st.prepLink[i]&&st.prepItems.includes(st.prepLink[i]))return!pd[st.prepLink[i]];
    return false;
  });
}
function missingType(i){return(st.prepItems.includes(i)||(st.prepLink[i]&&st.prepItems.includes(st.prepLink[i])))?'prep':'comprar';}
function allFI(){return Object.values(st.fi).flat();}
function getPK(d,m){return`${wk()}_${d}_${m}`;}
function computeShoppingList(){
  const needed=new Set();
  WEEK.forEach(di=>{MEALS.forEach((_,mi)=>{const r=getRecipe(st.plan[getPK(di,mi)]);if(r)r.req.forEach(i=>needed.add(i));});});
  const grouped={};const uncat=[];
  needed.forEach(item=>{
    let found=false;
    for(const cat of st.catOrder){if(st.fi[cat]&&st.fi[cat].includes(item)){if(!grouped[cat])grouped[cat]=[];grouped[cat].push(item);found=true;break;}}
    if(!found)uncat.push(item);
  });
  if(uncat.length)grouped['outros']=uncat;
  return{grouped,needed};
}
function toggleF(key,v){const i=st[key].indexOf(v);if(i>=0)st[key].splice(i,1);else st[key].push(v);}

  // ── TREINO ──
  if(st.tab==='treino'){
    h+=`<div class="dn">`;WEEK.forEach(i=>{h+=`<span class="${i===vd?'a':''}" onclick="setDay(${i})">${DF[i]}</span>`;});h+=`</div>`;
    h+=`<div class="fwrap">`;
    h+=`<div class="frow"><span class="flbl">modalidade</span>`;allMods.forEach(v=>{h+=`<span class="fc ${st.fMod.includes(v)?'on':''}" onclick="fToggle('fMod','${v}')">${v}</span>`;});h+=`</div>`;
    h+=`<div class="frow"><span class="flbl">turno</span>`;['manhã','tarde','noite'].forEach(v=>{h+=`<span class="fc ${st.fTurno.includes(v)?'on':''}" onclick="fToggle('fTurno','${v}')">${v}</span>`;});h+=`</div>`;
    h+=`<div class="frow"><span class="flbl">bairro</span>`;allBairros.forEach(v=>{h+=`<span class="fc ${st.fBairro.includes(v)?'on':''}" onclick="fToggle('fBairro','${v}')">${v}</span>`;});h+=`</div>`;
    h+=`</div><div class="dvd"></div>`;
    h+=`<div class="sec"><div class="slbl">gympass — check-in${hasF?` <span>${fSlots.length} resultado${fSlots.length!==1?'s':''}</span>`:''}<span class="addnew" onclick="openNewAct()">+ nova atividade</span></div>`;
    if(!fSlots.length){h+=`<div class="empty">${hasF?'nenhum resultado':'nenhuma atividade gympass hoje'}</div>`;}
    else{h+=`<div class="sl">`;fSlots.forEach((sl,i)=>{const k=`${vd}_${i}`,sel=st.selSlot===k;h+=`<div class="sr ${sel?'on':''}" onclick="selSlot('${k}')"><div class="st2">${fmt(sl.s)}${sl.e?'–'+sl.e:''}</div><div style="flex:1"><div class="sn">${sl.n}</div>${sl.sub?`<div class="ss">${sl.sub}</div>`:''}<div class="stags">${sl.b?`<span class="tb">${sl.b}</span>`:''}<span class="tt">${turno(sl.s)}</span></div></div><div style="display:flex;align-items:center;gap:6px"><button class="reb" onclick="event.stopPropagation();openEditAct(${sl.id})">editar</button><button class="del-act" onclick="event.stopPropagation();deleteAct(${sl.id})">✕</button><div class="cib ${sel?'on':''}">${sel?'marcado':'check-in'}</div></div></div>`;});h+=`</div>`;}
    h+=`</div>`;
    // lugares
    h+=`<div class="lt"><div class="lhd" onclick="st.lugaresOpen=!st.lugaresOpen;render()"><span style="font-size:13px;font-weight:600">lugares pra conhecer</span><div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:var(--mu)">${placeDone}/${allPlaces.length}</span><span style="font-size:12px;color:var(--mu);display:inline-block;transform:${st.lugaresOpen?'rotate(180deg)':'none'}">▾</span></div></div>`;

    }
    h+=`</div>`;
    h+=`<div class="spacer"></div>`;

      });
      if(st.editFr){h+=`<div class="sec"><div class="slbl">nova categoria</div><div class="arow"><input id="fi-newcat" class="inp" style="flex:1;font-size:12px" placeholder="nome da categoria"><button class="abtn" onclick="addFICat()">+</button></div></div>`;}
      h+=`<div class="sec"><div class="slbl">backup dos dados</div><div style="font-size:11px;color:var(--mu);text-transform:none;line-height:1.5;margin-bottom:8px">salva TUDO do app (geladeira, receitas, prep, treino, hábitos, água) num texto. toque em gerar pra copiar e guardar, ou cole um backup pra restaurar / passar pra outro aparelho.</div><button style="width:100%;background:var(--wl);color:var(--w);border:1.5px solid var(--w);border-radius:10px;padding:11px;font-size:13px;font-weight:600;cursor:pointer" onclick="genBackup()">gerar backup (copia automático)</button><textarea id="backup-out" class="nta" readonly placeholder="o backup vai aparecer aqui" style="text-transform:none;min-height:54px"></textarea><textarea id="backup-in" class="nta" placeholder="cole um backup aqui pra restaurar" style="text-transform:none;min-height:54px"></textarea><button style="width:100%;background:var(--wh);color:var(--w);border:1.5px solid var(--bd);border-radius:10px;padding:11px;font-size:13px;font-weight:600;cursor:pointer" onclick="restoreBackup()">restaurar backup</button></div>`;
      h+=`<div class="spacer"></div>`;
    }

    if(st.sub==='receitas'){
      h+=`<div class="sec"><div class="slbl">receitas <button class="eb ${st.editRec?'on':''}" onclick="st.editRec=!st.editRec;render()">${st.editRec?'pronto':'reordenar'}</button><span class="addnew" onclick="openNew()">+ nova receita</span></div></div>`;
      h+=`<div class="stabs">`;['todas','café da manhã','almoço/jantar','lanche'].forEach(c=>{h+=`<span class="${st.recFilt===c?'a':''}" onclick="setRecFilt('${c}')">${c}</span>`;});h+=`</div>`;
      h+=`<div class="sec">`;
      function rcCard(r,isAv){
        const gi=st.recOrd.indexOf(r.id),vi=filtIds.indexOf(r.id);
        const pg=filtIds[vi-1]!==undefined?st.recOrd.indexOf(filtIds[vi-1]):-1;
        const ng=filtIds[vi+1]!==undefined?st.recOrd.indexOf(filtIds[vi+1]):-1;
        const miss=isAv?[]:missing(r),noteOpen=!!st.openNotes[r.id],noteText=st.notes[r.id]||'';
        const missPrep=miss.filter(i=>missingType(i)==='prep');
        const missComprar=miss.filter(i=>missingType(i)==='comprar');
        let c=`<div class="rc ${isAv?'av':''}"><div class="rr"><div class="rb"><div class="rn">${r.n}</div>`;
        c+=`<div style="display:flex;gap:5px;margin-top:3px;flex-wrap:wrap">`;
        c+=`<span style="font-size:10px;color:var(--mu)">${r.cat}</span>`;
        c+=`</div>`;
        if(!isAv){
          if(missPrep.length)c+=`<div style="font-size:11px;color:var(--w);margin-top:3px">prep: ${missPrep.join(', ')}</div>`;
          if(missComprar.length)c+=`<div style="font-size:11px;color:#c0392b;margin-top:2px">comprar: ${missComprar.join(', ')}</div>`;
        }
        c+=`</div>`;
        if(st.editRec){c+=`<div class="rord"><button onclick="swapRec(${gi},${pg})" ${pg===-1?'disabled':''}>↑</button><button onclick="swapRec(${gi},${ng})" ${ng===-1?'disabled':''}>↓</button></div>`;}
        else{c+=`<div style="display:flex;gap:6px;align-items:center;flex-shrink:0">${isAv?`<span class="rav2">disponível</span>`:`<span class="rnav">faltam ${miss.length}</span>`}<button class="reb" onclick="openEdit(${r.id})">editar</button></div>`;}
        c+=`</div><span class="nt" onclick="toggleNote(${r.id},event)">${noteOpen?'▴':'▾'} notas${noteText?' ·':''}</span>`;
        if(noteOpen)c+=`<textarea class="nta" id="nta-${r.id}" onblur="saveNote(${r.id})" placeholder="anotações, links do tiktok...">${noteText}</textarea>`;
        c+=`</div>`;return c;
      }
      if(availR.length){h+=`<div class="slbl">disponível agora <span>${availR.length}</span></div>`;availR.forEach(r=>{h+=rcCard(r,true);});}
      if(noAvailR.length){h+=`<div class="slbl" style="margin-top:1rem">faltam ingredientes <span>${noAvailR.length}</span></div>`;noAvailR.forEach(r=>{h+=rcCard(r,false);});}
      if(!availR.length&&!noAvailR.length){h+=`<div class="empty">nenhuma receita nessa categoria</div>`;}
      h+=`</div><div class="spacer"></div>`;
    }

    if(st.sub==='prep'){
      const wkStart=getWkStart();
      const prepDone=st.prepItems.filter(i=>(st.prep[wkStart]||{})[i]).length;
      h+=`<div class="sec">`;
      h+=`<div class="slbl">prep do domingo <span>${prepDone}/${st.prepItems.length}</span> <button class="eb ${st.editPrep?'on':''}" onclick="st.editPrep=!st.editPrep;render()">${st.editPrep?'pronto':'editar'}</button>${!st.editPrep?` <span style="font-weight:400;color:#c0392b;cursor:pointer;letter-spacing:0" onclick="clearPrep()">limpar</span>`:''}</div>`;
      h+=`<div style="display:flex;flex-direction:column;gap:1px;background:var(--br);border-radius:14px;overflow:hidden;border:1px solid var(--br)">`;
      st.prepItems.forEach(item=>{
        const done=!!((st.prep[wkStart]||{})[item]);
        if(st.editPrep){
          h+=`<div style="background:var(--wh);display:flex;align-items:center;padding:14px 16px;gap:14px"><span style="font-size:14px;font-weight:500;flex:1">${item}</span><button class="del-act" onclick="removePrepItem('${item.replace(/'/g,"\\'")}')">✕</button></div>`;
        }else{
          h+=`<div style="background:${done?'var(--wl)':'var(--wh)'};display:flex;align-items:center;padding:14px 16px;gap:14px;cursor:pointer" onclick="togglePrep('${item.replace(/'/g,"\\'")}')">
          <div style="width:22px;height:22px;border-radius:6px;border:1.5px solid ${done?'var(--w)':'var(--bd)'};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:${done?'var(--w)':'transparent'};color:${done?'#fff':'transparent'}">${done?'✓':''}</div>
          <span style="font-size:14px;font-weight:500;flex:1;color:${done?'var(--w)':'var(--tx)'}">${item}</span>
        </div>`;
        }
      });
      h+=`</div>`;
      if(st.editPrep){h+=`<div class="arow" style="margin-top:8px"><input id="prep-new" class="inp" style="flex:1;font-size:12px" placeholder="novo item de prep"><button class="abtn" onclick="addPrepItem()">+</button></div>`;}
      if(!st.editPrep&&st.prepItems.length&&prepDone===st.prepItems.length)h+=`<div style="text-align:center;padding:1rem;font-size:13px;color:var(--gn);font-weight:500">geladeira pronta pra semana</div>`;
      h+=`</div><div class="spacer"></div>`;
    }
  }
  if(st.modal){
    const {day,meal}=st.modal;
    const relCats=meal===0?['café da manhã']:meal===2?['lanche']:['almoço/jantar'];
    const relR=allRecipes().filter(r=>relCats.includes(r.cat));
    const aR=relR.filter(r=>recAvail(r)),nR=relR.filter(r=>!recAvail(r));
    const curId=st.plan[getPK(day,meal)];
    h+=`<div class="ov" onclick="st.modal=null;render()"><div class="mo" onclick="event.stopPropagation()"><div class="mot">${DF[day]} — ${MEALS[meal]}</div>`;
    if(aR.length){h+=`<div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--mu);margin-bottom:6px">disponível agora</div>`;aR.forEach(r=>{h+=`<div class="mor" onclick="pickMeal(${r.id})"><div><div style="font-size:13px;font-weight:500">${r.n}${r.id===curId?' ✓':''}</div><div style="font-size:11px;color:var(--mu)">${r.cat}</div></div><span class="rav2">ok</span></div>`;});}
    if(nR.length){h+=`<div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--mu);margin:10px 0 6px">faltam ingredientes</div>`;nR.forEach(r=>{const m=missing(r);h+=`<div class="mor" onclick="pickMeal(${r.id})"><div><div style="font-size:13px;font-weight:500">${r.n}${r.id===curId?' ✓':''}</div><div style="font-size:11px;color:var(--mu)">falta: ${m.join(', ')}</div></div></div>`;});}
    if(curId)h+=`<div class="del" onclick="clearMeal()">remover refeição</div>`;
    h+=`<button class="moc" onclick="st.modal=null;render()">fechar</button></div></div>`;
  }

  // ── RECIPE EDIT MODAL ──
  if(st.editModal!==null){
    const CATS=['café da manhã','almoço/jantar','lanche'];
    const reqSet=new Set(st.em.req);
    const isNew=!RB.find(r=>r.id===st.editModal)&&!st.ov[st.editModal];
    let picker='';
    st.catOrder.forEach(cat=>{const items=st.fi[cat];if(!items||!items.length)return;picker+=`<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--mu);margin-bottom:5px">${cat}</div><div style="display:flex;flex-wrap:wrap;gap:5px">`;items.forEach(item=>{picker+=`<div class="fchip ${reqSet.has(item)?'on':''}" style="font-size:11px;padding:4px 10px" onclick="toggleEI('${item.replace(/'/g,"\\'")}')"> ${item}</div>`;});picker+=`</div></div>`;});
    let prepPicker='';st.prepItems.forEach(item=>{prepPicker+=`<div class="fchip ${reqSet.has(item)?'on':''}" style="font-size:11px;padding:4px 10px" onclick="toggleEI('${item.replace(/'/g,"\\'")}')"> ${item}</div>`;});
    h+=`<div class="ov" onclick="st.editModal=null;render()"><div class="mo" onclick="event.stopPropagation()"><div class="mot">${isNew?'nova receita':'editar receita'}</div>`;
    h+=`<div class="fi2"><label class="fl">nome</label><input id="re-n" class="inp" value="${(st.em.n||'').replace(/"/g,'&quot;')}" placeholder="nome da receita"></div>`;
    h+=`<div class="fi2"><label class="fl">categoria</label><select id="re-c" class="inp">${CATS.map(c=>`<option value="${c}" ${st.em.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>`;
    h+=`<div class="fi2"><label class="fl">ingredientes ${st.em.req.length?`<span style="font-weight:400;color:var(--w)">${st.em.req.join(', ')}</span>`:''}</label>${picker}<div class="arow"><input id="re-ni" class="inp" style="flex:1" placeholder="outro ingrediente"><button class="abtn" onclick="addEI()">+</button></div></div>`;
    h+=`<div class="fi2"><label class="fl">dá pra deixar pronto <span style="font-weight:400;color:var(--mu)">(prep)</span></label><div style="display:flex;flex-wrap:wrap;gap:5px">${prepPicker}</div></div>`;
    h+=`<button style="width:100%;background:var(--w);color:#fff;font-size:15px;font-weight:600;border:none;border-radius:14px;padding:16px;cursor:pointer;margin-top:1rem" onclick="saveEdit()">salvar</button>`;
    if(!isNew)h+=`<div class="del" onclick="deleteRec(${st.editModal})">excluir receita</div>`;
    h+=`<button class="moc" onclick="st.editModal=null;render()">cancelar</button></div></div>`;
  }

  // ── ADD / EDIT ACTIVITY MODAL ──
  if(st.actModal){
    const na=st.na;
    const locais=getAllLocais();
    const mods=getAllMods();
    const bairros=getAllBairros();
    const isEdit=!!st.actEditId;

    h+=`<div class="ov" onclick="closeActModal()"><div class="mo" onclick="event.stopPropagation()"><div class="mot">${isEdit?'editar atividade':'nova atividade'}</div>`;

    // 1. local — lista gerenciável
    h+=`<div class="fi2"><label class="fl">local <button class="eb ${st.editLocais?'on':''}" style="margin-left:6px" onclick="toggleEditLocais()">${st.editLocais?'pronto':'gerenciar'}</button></label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:5px">`;
    locais.forEach(l=>{
      if(st.editLocais){h+=`<span class="fc on">${l}<span style="cursor:pointer;margin-left:6px;font-weight:700" onclick="removeLocal('${l.replace(/'/g,"\\'")}')">✕</span></span>`;}
      else{h+=`<span class="fc ${na.n===l?'on':''}" onclick="selectLocal('${l.replace(/'/g,"\\'")}')">${l}</span>`;}
    });
    h+=`</div><div class="arow"><input id="na-local-new" class="inp" style="flex:1;font-size:12px;margin-top:6px" placeholder="novo local"><button class="abtn" onclick="addLocal()">+</button></div></div>`;

    // 2. detalhe (opcional)
    h+=`<div class="fi2"><label class="fl">detalhe <span style="font-weight:400;color:var(--mu)">(opcional)</span></label><input id="na-sub" class="inp" value="${(na.sub||'').replace(/"/g,'&quot;')}" placeholder="ex: one to one, alef, avançado..."></div>`;

    // 3. modalidade
    h+=`<div class="fi2"><label class="fl">modalidade</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:5px">`;
    mods.forEach(m=>{h+=`<span class="fc ${na.m===m?'on':''}" onclick="setNaChip('m','${m.replace(/'/g,"\\'")}')">${m}</span>`;});
    h+=`</div><div class="arow"><input id="na-m-new" class="inp" style="flex:1;font-size:12px;margin-top:6px" placeholder="outra modalidade"><button class="abtn" onclick="addNaMod()">+</button></div></div>`;

    // 4. bairro
    h+=`<div class="fi2"><label class="fl">bairro</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:5px">`;
    bairros.forEach(b=>{h+=`<span class="fc ${na.b===b?'on':''}" onclick="setNaChip('b','${b.replace(/'/g,"\\'")}')">${b}</span>`;});
    h+=`</div><div class="arow"><input id="na-b-new" class="inp" style="flex:1;font-size:12px;margin-top:6px" placeholder="outro bairro"><button class="abtn" onclick="addNaBairro()">+</button></div></div>`;

    // 5. dias
    h+=`<div class="fi2"><label class="fl">dias da semana</label><div class="days-grid">`;
    WEEK.forEach(i=>{h+=`<label class="day-cb"><input type="checkbox" onchange="toggleDay(${i})" ${na.days.includes(i)?'checked':''}><span>${DS[i]}</span></label>`;});
    h+=`</div></div>`;

    // 6. horário
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="fi2"><label class="fl">início</label><input type="time" id="na-start" class="inp" value="${na.start||'09:00'}"></div><div class="fi2"><label class="fl">fim <span style="font-weight:400;color:var(--mu)">(opcional)</span></label><input type="time" id="na-end" class="inp" value="${na.end||''}"></div></div>`;

    const canSave=na.n&&na.days.length;
    h+=`<button style="width:100%;background:${canSave?'var(--w)':'var(--bd)'};color:${canSave?'#fff':'var(--mu)'};font-size:15px;font-weight:600;border:none;border-radius:14px;padding:16px;cursor:${canSave?'pointer':'default'};margin-top:1rem" onclick="${canSave?'saveAct()':''}">${isEdit?'salvar':'adicionar'}</button>`;
    if(isEdit)h+=`<div class="del" onclick="deleteAct(${st.actEditId})">excluir atividade</div>`;
    h+=`<button class="moc" onclick="closeActModal()">cancelar</button></div></div>`;
  }

  // ── HÁBITOS ──
  if(st.tab==='hab'){
    const td=today();
    const now=new Date();
    // Get Mon-Sun dates of current week
    const dow=now.getDay(); // 0=sun
    const mondayOffset=dow===0?-6:1-dow;
    const weekDates=Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(now.getDate()+mondayOffset+i);return d;});
    const dayLabels=['seg','ter','qua','qui','sex','sáb','dom'];
    // Total done today
    const todayStr=td;
    const todayDone=HABITS.filter(hb2=>(st.hb[todayStr]||{})[hb2]).length;
    // Streak
    let streak=0;
    for(let i=1;i<=365;i++){const d=new Date(now);d.setDate(now.getDate()-i);const dk=d.toDateString();const dh=st.hb[dk]||{};if(HABITS.every(hb2=>dh[hb2]))streak++;else break;}

    h+=`<div style="padding:1.25rem 1.25rem 0">`;
    h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">`;
    h+=`<div style="font-size:16px;font-weight:700;color:var(--tx)">esta semana</div>`;
    if(streak>0)h+=`<div style="font-size:11px;color:var(--w);font-weight:600">${streak} dia${streak!==1?'s':''} completos seguidos</div>`;
    h+=`</div>`;

    // Grid
    const cellW=32;
    h+=`<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">`;
    h+=`<table style="border-collapse:collapse;width:100%;min-width:360px">`;

    // Header row - day labels
    h+=`<thead><tr><td style="width:40%;padding-bottom:8px;font-size:10px;color:var(--mu)"></td>`;
    weekDates.forEach((d,i)=>{
      const isToday=d.toDateString()===td;
      h+=`<td style="text-align:center;padding-bottom:8px;font-size:10px;font-weight:${isToday?700:500};color:${isToday?'var(--w)':'var(--mu)'}">${dayLabels[i]}<br><span style="font-size:9px">${d.getDate()}</span></td>`;
    });
    h+=`</tr></thead>`;

    // Habit rows
    h+=`<tbody>`;
    HABITS.forEach(hab=>{
      const weekDone=weekDates.filter(d=>(st.hb[d.toDateString()]||{})[hab]).length;
      h+=`<tr>`;
      h+=`<td style="padding:4px 8px 4px 0;font-size:12px;font-weight:500;color:var(--tx);vertical-align:middle">${hab}</td>`;
      weekDates.forEach(d=>{
        const ds=d.toDateString();
        const checked=!!(st.hb[ds]&&st.hb[ds][hab]);
        const isToday=ds===td;
        const isFuture=d>now&&ds!==td;
        const safeHab=hab.replace(/'/g,"\\'");
        const safeDs=ds.replace(/'/g,"\\'");
        const clickAttr=isFuture?'':'onclick="toggleHabit(\''+safeHab+'\',\''+safeDs+'\')"';
        h+=`<td style="text-align:center;padding:4px 2px;vertical-align:middle">
          <div ${clickAttr} style="width:28px;height:28px;border-radius:7px;border:1.5px solid ${checked?'var(--w)':isToday?'var(--w)':'var(--bd)'};background:${checked?'var(--w)':isToday?'var(--wl)':'transparent'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:${checked?'#fff':'transparent'};cursor:${isFuture?'default':'pointer'};margin:0 auto;opacity:${isFuture?0.35:1}">${checked?'✓':''}</div>
        </td>`;
      });
      h+=`</tr>`;
    });
    h+=`</tbody>`;

    // Progress row per day
    h+=`<tfoot><tr><td style="padding-top:10px;font-size:9px;color:var(--mu)">%</td>`;
    weekDates.forEach(d=>{
      const ds=d.toDateString();
      const dayDone=HABITS.filter(hb2=>(st.hb[ds]||{})[hb2]).length;
      const pct=Math.round(dayDone/HABITS.length*100);
      const isToday=ds===td;
      h+=`<td style="text-align:center;padding-top:10px;vertical-align:top">
        <div style="font-size:9px;font-weight:600;color:${pct===100?'var(--gn)':isToday?'var(--w)':'var(--mu)'}">${pct}%</div>
        <div style="height:3px;background:var(--br);border-radius:2px;margin-top:3px;width:24px;margin-left:auto;margin-right:auto">
          <div style="height:3px;width:${pct}%;background:${pct===100?'var(--gn)':'var(--w)'};border-radius:2px"></div>
        </div>
      </td>`;
    });
    h+=`</tr></tfoot></table></div>`;
    h+=`</div><div class="spacer"></div>`;
  }

  // ── ÁGUA ──
  if(st.tab==='agua'){
    const td=today();
    const count=st.wt[td]||0;
    const pct=Math.min(count/WATER_GOAL,1);
    const ml=count*WATER_ML;
    h+=`<div class="sec">`;
    h+=`<div class="slbl">ingestão de água hoje</div>`;
    h+=`<div style="text-align:center;padding:1.5rem 0 1rem">`;
    h+=`<div style="font-size:52px;font-weight:700;color:var(--w);line-height:1">${count}</div>`;
    h+=`<div style="font-size:13px;color:var(--mu);margin-top:4px">${ml}ml de ${WATER_GOAL*WATER_ML}ml · ${count}/${WATER_GOAL} garrafas</div>`;
    h+=`</div>`;
    // progress bar
    h+=`<div style="margin:0 1.25rem 1.5rem;height:8px;background:var(--br);border-radius:4px;overflow:hidden"><div style="height:8px;width:${Math.round(pct*100)}%;background:var(--w);border-radius:4px;transition:width .3s"></div></div>`;
    // bottles visual
    h+=`<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 1.25rem 1.5rem">`;
    for(let i=0;i<WATER_GOAL;i++){const full=i<count;h+=`<div style="width:42px;height:60px;border-radius:8px;border:2px solid ${full?'var(--w)':'var(--bd)'};background:${full?'var(--wl)':'transparent'};display:flex;align-items:center;justify-content:center;font-size:18px">${full?'💧':'○'}</div>`;}
    h+=`</div>`;
    // buttons
    h+=`<div style="display:flex;gap:10px;padding:0 1.25rem">`;
    h+=`<button style="flex:1;padding:14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--wh);font-size:22px;cursor:pointer" onclick="removeWater()" ${count===0?'disabled':''}>−</button>`;
    h+=`<button style="flex:2;padding:14px;border-radius:12px;border:none;background:var(--w);color:#fff;font-size:15px;font-weight:600;cursor:pointer" onclick="addWater()">+ garrafa 750ml</button>`;
    h+=`</div>`;
    if(count>=WATER_GOAL)h+=`<div style="text-align:center;padding:1rem;font-size:13px;color:var(--gn);font-weight:500">meta atingida! 🎉</div>`;
    h+=`</div><div class="spacer"></div>`;
  }

  document.getElementById('app').innerHTML=h;
}

// ── ACTIONS ──
function setDay(i){st.vd=i;st.selSlot=null;render();}
function setTab(t){st.tab=t;render();}
function setSub(t){st.sub=t;render();}
function setRecFilt(f){st.recFilt=f;render();}
function fToggle(key,v){toggleF(key,v);render();}
function selSlot(k){st.selSlot=st.selSlot===k?null:k;render();}
function toggleCI(){const w=wk();if(!st.ci[w])st.ci[w]={};if(st.ci[w][st.vd])delete st.ci[w][st.vd];else st.ci[w][st.vd]=true;sv('liz_ci',st.ci);render();}
function togglePlace(i){st.places[i]=!st.places[i];sv('liz_pl',st.places);render();}
function addPlace(){const el=document.getElementById('pl-new');const val=el?el.value.trim().toLowerCase():'';if(!val)return;st.customPlaces.push(val);sv('liz_cp',st.customPlaces);if(el)el.value='';render();}
function deletePlace(i){const defLen=PLACES_DEFAULT.length;if(i<defLen)return;const ci=i-defLen;st.customPlaces.splice(ci,1);sv('liz_cp',st.customPlaces);render();}
function toggleFridge(item){st.fridge[item]=!st.fridge[item];sv('liz_fr',st.fridge);render();}
function moveCat(i,dir){const a=st.catOrder,j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];sv('liz_cat',a);render();}
function addFI(cat,sid){const el=document.getElementById('fi-'+sid);const val=el?el.value.trim().toLowerCase():'';if(!val)return;if(!st.fi[cat])st.fi[cat]=[];if(!st.fi[cat].includes(val))st.fi[cat].push(val);sv('liz_fi',st.fi);render();}
function removeFI(cat,item){if(!st.fi[cat])return;st.fi[cat]=st.fi[cat].filter(i=>i!==item);delete st.fridge[item];sv('liz_fi',st.fi);sv('liz_fr',st.fridge);render();}
function addFICat(){const el=document.getElementById('fi-newcat');const val=el?el.value.trim().toLowerCase():'';if(!val||st.fi[val])return;st.fi[val]=[];if(!st.catOrder.includes(val))st.catOrder.push(val);sv('liz_fi',st.fi);sv('liz_cat',st.catOrder);render();}
function swapRec(a,b){if(a<0||b<0)return;[st.recOrd[a],st.recOrd[b]]=[st.recOrd[b],st.recOrd[a]];sv('liz_ro',st.recOrd);render();}
function openModal(d,m){st.modal={day:d,meal:m};render();}
function pickMeal(id){if(!st.modal)return;st.plan[getPK(st.modal.day,st.modal.meal)]=id;sv('liz_pn',st.plan);st.modal=null;render();}
function clearMeal(){if(!st.modal)return;delete st.plan[getPK(st.modal.day,st.modal.meal)];sv('liz_pn',st.plan);st.modal=null;render();}
function swapMeal(ka,kb){const ta=st.plan[ka],tb=st.plan[kb];if(tb)st.plan[ka]=tb;else delete st.plan[ka];if(ta)st.plan[kb]=ta;else delete st.plan[kb];sv('liz_pn',st.plan);render();}
function openNew(){const newId=Date.now();st.editModal=newId;st.em={n:'',cat:'almoço/jantar',req:[]};st.newIngr='';render();}
function openEdit(id){const r=getRecipe(id);if(!r)return;st.editModal=id;st.em={n:r.n,cat:r.cat,req:[...r.req]};st.newIngr='';render();}
function saveEdit(){const n=(document.getElementById('re-n')||{}).value||'';const c=(document.getElementById('re-c')||{}).value||'';if(!n.trim())return;const id=st.editModal;st.ov[id]={n:n.trim().toLowerCase(),cat:c,req:st.em.req};sv('liz_ov',st.ov);if(!st.recOrd.includes(id)){st.recOrd.push(id);sv('liz_ro',st.recOrd);}st.editModal=null;render();}
function deleteRec(id){st.ov[id]={...(st.ov[id]||{}),deleted:true};sv('liz_ov',st.ov);st.recOrd=st.recOrd.filter(x=>x!==id);sv('liz_ro',st.recOrd);st.editModal=null;render();}
function toggleEI(item){const n=(document.getElementById('re-n')||{}).value;const c=(document.getElementById('re-c')||{}).value;if(n)st.em.n=n;if(c)st.em.cat=c;const idx=st.em.req.indexOf(item);if(idx>=0)st.em.req.splice(idx,1);else st.em.req.push(item);render();}
function addEI(){const n=(document.getElementById('re-n')||{}).value;const c=(document.getElementById('re-c')||{}).value;if(n)st.em.n=n;if(c)st.em.cat=c;const el=document.getElementById('re-ni');const val=el?el.value.trim().toLowerCase():'';if(val&&!st.em.req.includes(val)){st.em.req.push(val);if(!allFI().includes(val)){if(!st.fi['outros'])st.fi['outros']=[];if(!st.fi['outros'].includes(val))st.fi['outros'].push(val);sv('liz_fi',st.fi);}}render();}
function toggleNote(id,e){e.stopPropagation();st.openNotes[id]=!st.openNotes[id];render();}
function saveNote(id){const el=document.getElementById('nta-'+id);if(el){st.notes[id]=el.value;sv('liz_nt',st.notes);}}
function captureNa(){const g=id=>document.getElementById(id);if(g('na-sub'))st.na.sub=g('na-sub').value;if(g('na-start'))st.na.start=g('na-start').value;if(g('na-end'))st.na.end=g('na-end').value;}
function endToTime(e){if(!e)return'';const m=String(e).replace(/h/g,'').trim();const p=m.split(':');const h=parseInt(p[0]);if(isNaN(h))return'';const mi=p[1]?parseInt(p[1]):0;return`${String(h).padStart(2,'0')}:${String(mi||0).padStart(2,'0')}`;}
function openNewAct(){st.actModal=true;st.actEditId=null;st.editLocais=false;st.na={n:'',sub:'',b:'',m:'',days:[st.vd],start:'09:00',end:''};render();}
function openEditAct(id){const a=st.acts.find(x=>x.id===id);if(!a)return;st.actModal=true;st.actEditId=id;st.editLocais=false;const sh=Math.floor(a.s/60),sm=a.s%60;st.na={n:a.n||'',sub:a.sub||'',b:a.b||'',m:a.m||'',days:[...(a.days||[])],start:`${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}`,end:endToTime(a.e)};render();}
function closeActModal(){st.actModal=false;st.actEditId=null;st.editLocais=false;st.na={n:'',sub:'',b:'',m:'',days:[],start:'09:00',end:''};render();}
function selectLocal(name){captureNa();st.na.n=st.na.n===name?'':name;render();}
function addLocal(){captureNa();const el=document.getElementById('na-local-new');const val=el?el.value.trim().toLowerCase():'';if(!val)return;if(!st.locais.includes(val)){st.locais.push(val);sv('liz_locais',st.locais);}st.na.n=val;render();}
function removeLocal(name){st.locais=st.locais.filter(l=>l!==name);sv('liz_locais',st.locais);if(st.na.n===name)st.na.n='';render();}
function toggleEditLocais(){captureNa();st.editLocais=!st.editLocais;render();}
function toggleDay(i){captureNa();const idx=st.na.days.indexOf(i);if(idx>=0)st.na.days.splice(idx,1);else st.na.days.push(i);render();}
function setNaChip(field,val){captureNa();st.na[field]=st.na[field]===val?'':val;render();}
function addNaMod(){captureNa();const el=document.getElementById('na-m-new');const val=el?el.value.trim().toLowerCase():'';if(!val)return;if(!st.mods.includes(val)){st.mods.push(val);sv('liz_mods',st.mods);}st.na.m=val;render();}
function addNaBairro(){captureNa();const el=document.getElementById('na-b-new');const val=el?el.value.trim().toLowerCase():'';if(!val)return;if(!st.bairros.includes(val)){st.bairros.push(val);sv('liz_bairros',st.bairros);}st.na.b=val;render();}
function saveAct(){
  captureNa();
  const lg=document.getElementById('na-local-new');
  if(!st.na.n&&lg&&lg.value.trim())st.na.n=lg.value.trim().toLowerCase();
  if(!st.na.n||!st.na.days.length)return;
  if(!st.locais.includes(st.na.n)){st.locais.push(st.na.n);sv('liz_locais',st.locais);}
  const [sh,sm]=(st.na.start||'09:00').split(':').map(Number);
  const s=(sh||0)*60+(sm||0);
  let e='';if(st.na.end){const[eh,em]=st.na.end.split(':').map(Number);e=em?`${eh}:${String(em).padStart(2,'0')}h`:`${eh}h`;}
  const data={n:st.na.n,sub:(st.na.sub||'').trim().toLowerCase(),b:st.na.b||'',m:st.na.m||'',s,e,days:[...st.na.days]};
  if(st.actEditId){const i=st.acts.findIndex(a=>a.id===st.actEditId);if(i>=0)st.acts[i]={...st.acts[i],...data};}
  else{st.acts.push({id:Date.now(),...data});}
  sv('liz_acts',st.acts);closeActModal();
}
function toggleHabit(hab,ds){const k=ds||today();if(!st.hb[k])st.hb[k]={};st.hb[k][hab]=!st.hb[k][hab];sv('liz_hb',st.hb);render();}
function togglePrep(item){const ws=getWkStart();if(!st.prep[ws])st.prep[ws]={};st.prep[ws][item]=!st.prep[ws][item];sv('liz_prep',st.prep);render();}
function clearPrep(){const ws=getWkStart();st.prep[ws]={};sv('liz_prep',st.prep);render();}
function addPrepItem(){const el=document.getElementById('prep-new');const val=el?el.value.trim().toLowerCase():'';if(!val)return;if(!st.prepItems.includes(val)){st.prepItems.push(val);sv('liz_prepitems',st.prepItems);}render();}
function removePrepItem(item){st.prepItems=st.prepItems.filter(p=>p!==item);sv('liz_prepitems',st.prepItems);render();}
function flushState(){sv('liz_ci',st.ci);sv('liz_pl',st.places);sv('liz_cp',st.customPlaces);sv('liz_fr',st.fridge);sv('liz_pn',st.plan);sv('liz_cat',st.catOrder);sv('liz_ro',st.recOrd);sv('liz_ov',st.ov);sv('liz_fi',st.fi);sv('liz_nt',st.notes);sv('liz_acts',st.acts);sv('liz_locais',st.locais);sv('liz_bairros',st.bairros);sv('liz_mods',st.mods);sv('liz_sc',st.sc);sv('liz_se',st.se);sv('liz_hb',st.hb);sv('liz_wt',st.wt);sv('liz_prep',st.prep);sv('liz_prepitems',st.prepItems);}
function exportData(){flushState();const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('liz_')===0)o[k]=localStorage.getItem(k);}return JSON.stringify(o);}
function genBackup(){const t=exportData();const el=document.getElementById('backup-out');if(el)el.value=t;try{if(navigator.clipboard)navigator.clipboard.writeText(t);}catch(e){}}
function restoreBackup(){const el=document.getElementById('backup-in');if(!el||!el.value.trim())return;let o;try{o=JSON.parse(el.value);}catch(e){alert('backup inválido — confira o texto colado');return;}if(!confirm('isso vai substituir os dados atuais do app por esse backup. continuar?'))return;Object.keys(o).forEach(k=>{if(k.indexOf('liz_')===0)localStorage.setItem(k,o[k]);});location.reload();}
function addWater(){const td=today();st.wt[td]=(st.wt[td]||0)+1;sv('liz_wt',st.wt);render();}
function removeWater(){const td=today();if((st.wt[td]||0)>0)st.wt[td]--;sv('liz_wt',st.wt);render();}
function deleteAct(id){st.acts=st.acts.filter(a=>a.id!==id);sv('liz_acts',st.acts);if(st.actEditId===id)closeActModal();else render();}
function toggleShopItem(item){st.sc[item]=!st.sc[item];sv('liz_sc',st.sc);render();}
function addShopExtra(){const el=document.getElementById('se-new');const val=el?el.value.trim().toLowerCase():'';if(!val)return;st.se.push(val);sv('liz_se',st.se);if(el)el.value='';render();}
function removeShopExtra(i){st.se.splice(i,1);sv('liz_se',st.se);render();}
function clearShopChecked(){st.sc={};sv('liz_sc',st.sc);render();}

render();
</script>
</body>
</html>
